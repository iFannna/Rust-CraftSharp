<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
        font-size: 13px;
        color: #e8e8e8;
        user-select: none;
        -webkit-user-select: none;
      }

      .panel {
        box-sizing: border-box;
        height: 100vh;
        padding: 16px;
        border: 1px solid #3a3a3a;
        border-radius: 8px;
        background: #2b2b2b;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        height: 30px;
        padding: 0 8px;
        border: 1px solid #3f3f3f;
        border-radius: 4px;
        background: #202020;
        color: #e8e8e8;
        font: inherit;
        outline: none;
      }

      input:focus {
        border-color: #0078d4;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      button {
        height: 28px;
        min-width: 64px;
        padding: 0 12px;
        border: 1px solid #3f3f3f;
        border-radius: 4px;
        background: #333;
        color: inherit;
        font: inherit;
        cursor: default;
      }

      button:hover {
        background: #3d3d3d;
      }

      #ok {
        border-color: #0078d4;
        background: #0078d4;
      }

      #ok:hover {
        background: #106ebe;
      }
    </style>
    <title>重命名</title>
  </head>
  <body>
    <div class="panel">
      <input id="name" spellcheck="false" autocomplete="off" />
      <div class="actions">
        <button id="cancel" type="button">取消</button>
        <button id="ok" type="button">确定</button>
      </div>
    </div>
    <script type="module" src="/src/windows/rename.ts"></script>
  </body>
</html>
