<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }

      body {
        padding: 0;
        font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
        font-size: 13px;
        color: #e8e8e8;
      }

      .menu {
        box-sizing: border-box;
        height: 100vh;
        padding: 5px 0;
        border: 1px solid #3a3a3a;
        border-radius: 8px;
        background: #2b2b2b;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }

      button {
        display: block;
        width: 100%;
        height: 30px;
        padding: 0 14px;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: default;
      }

      button:hover:enabled {
        background: rgba(255, 255, 255, 0.08);
      }

      button:disabled {
        color: #6f6f6f;
      }

      .separator {
        height: 9px;
        margin: 0 10px;
        border-top: 1px solid #3f3f3f;
        box-sizing: border-box;
      }
    </style>
    <title>CraftSharp 菜单</title>
  </head>
  <body>
    <div class="menu" id="menu"></div>
    <script type="module" src="/src/menu.ts"></script>
  </body>
</html>
