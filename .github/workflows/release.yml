name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/desktop
    shell: bash

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Verify tag matches project version
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v26.11.20"; exit 1; }
          node - <<'EOF'
          const fs = require("fs");
          const pkg = require("./package.json").version;
          const conf = require("./src-tauri/tauri.conf.json").version;
          const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version = "(.+)"$/m)[1];
          const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
          for (const [name, value] of [["package.json", pkg], ["tauri.conf.json", conf], ["Cargo.toml", cargo]]) {
            if (value !== tag) {
              console.error(`${name} version ${value} does not match tag ${tag}`);
              process.exit(1);
            }
          }
          EOF
          grep -q "v${version} Craft#" src/settings/index.tsx
          grep -q "\"${version}\"" src/settings/sections/aboutSection.tsx
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          state="$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null || echo missing)"
          if [ "$state" = "false" ]; then
            echo "release $tag is already published, refusing to replace it"
            exit 1
          fi
          if [ "$state" = "missing" ]; then
            gh release create "$tag" --draft --title "$tag" --generate-notes
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installers
        run: npm run package

      - name: Stage and verify assets
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          bundle="src-tauri/target/release/bundle"
          stage="$RUNNER_TEMP/release-assets"
          rm -rf "$stage"
          mkdir -p "$stage"

          setup=( "$bundle"/nsis/*-setup.exe )
          msis=( "$bundle"/msi/*.msi )
          [ "${#setup[@]}" -eq 1 ] || { echo "expected one NSIS installer, found ${#setup[@]}"; exit 1; }
          [ "${#msis[@]}" -eq 2 ] || { echo "expected two MSI installers, found ${#msis[@]}"; exit 1; }

          cp "${setup[0]}" "$stage/CraftSharp_${version}_Windows_x64-setup.exe"
          for file in "${msis[@]}"; do
            base="$(basename "$file" .msi)"
            lang="${base##*_x64_}"
            cp "$file" "$stage/CraftSharp_${version}_Windows_x64_${lang}.msi"
          done

          for file in "$stage"/*; do
            size="$(stat -c%s "$file")"
            [ "$size" -gt 1000000 ] || { echo "$(basename "$file") is suspiciously small"; exit 1; }
            echo "$(sha256sum "$file")"
          done
          ls -l "$stage"

      - name: Upload assets to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release-assets/* --clobber

      - name: Windows assets ready
        run: echo "Windows assets uploaded; Linux build follows"

  linux:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Linux binary
        run: cargo build --release --features tauri/custom-protocol --bin craftsharp-desktop --manifest-path src-tauri/Cargo.toml

      - name: Package deb
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bash linux/package-deb.sh "$version" src-tauri/target/release/craftsharp-desktop "CraftSharp_${version}_Linux_amd64.deb"
          ls -l "CraftSharp_${version}_Linux_amd64.deb"

      - name: Upload Linux asset to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" "CraftSharp_${version}_Linux_amd64.deb" --clobber

      - name: Verify draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          count="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')"
          [ "$count" -eq 4 ] || { echo "expected 4 assets, found $count"; exit 1; }
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | "\(.name) \(.size)"'

      - name: Draft ready
        run: echo "Draft release $GITHUB_REF_NAME is ready, review and publish manually"
